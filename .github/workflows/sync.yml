name: sync-subsidiaries
# 노션 「자회사 공개 DB」(oopy 발행 /portfolio) → data/subsidiaries.json
# 변경이 있을 때만 커밋한다. Pages는 main 푸시로 자동 재배포.
on:
  schedule:
    - cron: "17 * * * *"      # 매시 17분(UTC) — 노션에서 고치면 최대 1시간 안에 반영
  workflow_dispatch: {}       # Actions 탭에서 「Run workflow」로 즉시 실행
permissions:
  contents: write
concurrency:
  group: sync-subsidiaries
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync from Notion public DB (via oopy SSR)
        run: python scripts/sync_subsidiaries.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/subsidiaries.json; then
            echo "no change"; exit 0
          fi
          git config user.name "cbnu-home-sync[bot]"
          git config user.email "cbnuholdings@users.noreply.github.com"
          git add data/subsidiaries.json
          git commit -m "chore(data): 자회사 공개 DB 동기화 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
