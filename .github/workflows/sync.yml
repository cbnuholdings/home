name: sync-subsidiaries
# 노션 「자회사 공개 DB」(oopy 발행 /portfolio) → data/subsidiaries.json
# 노션 홈 NOTICE 목록 → data/notices.json (단독 미리보기·대체용. 라이브 카드는 페이지 DOM에서 즉시 읽는다)
# 변경이 있을 때만 커밋한다. Pages는 main 푸시로 자동 재배포.
on:
  schedule:
    - cron: "17 * * * *"      # 매시 17분(UTC) — 노션에서 고치면 최대 1시간 안에 반영
  workflow_dispatch: {}       # Actions 탭에서 「Run workflow」로 즉시 실행
permissions:
  contents: write
concurrency:
  group: sync-subsidiaries
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync subsidiaries (Notion public DB via oopy SSR)
        run: python scripts/sync_subsidiaries.py
      - name: Sync notices (Notion home NOTICE via oopy SSR)
        env:
          NOTICE_SRC: https://www.cbnuholdings.com/
        run: python scripts/sync_notices.py || echo "notices sync skipped"
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/; then
            echo "no change"; exit 0
          fi
          git config user.name "cbnu-home-sync[bot]"
          git config user.email "cbnuholdings@users.noreply.github.com"
          git add data/
          git commit -m "chore(data): 노션 동기화(자회사·공지) $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
