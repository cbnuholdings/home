<head>
  <!-- CBNU Tech Holdings 인터랙티브 홈 로더 — 「홈 리뉴얼안 (검토용 초안)」 페이지 전용. 홈 적용 시에는 loader.html 을 쓴다(data-paths="/").
       자산 URL에 5분 단위 버전(?v=)을 붙여 GitHub Pages 캐시(10분)를 우회한다 → git push 후 늦어도 5분 안에 방문자에게 반영. -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
  <script>
    (function () {
      var BASE = 'https://cbnuholdings.github.io/home';
      var v = Math.floor(Date.now() / 300000);           // 5분 버킷
      var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = BASE + '/assets/home.css?v=' + v;
      document.head.appendChild(l);
      var s = document.createElement('script'); s.defer = true; s.src = BASE + '/assets/home.js?v=' + v;
      s.setAttribute('data-paths', '/3bdfc8d8-805b-81ee-8f1b-e2d2cc7b0a9d,/3bdfc8d8805b81ee8f1be2d2cc7b0a9d');
      document.head.appendChild(s);
    })();
    function handleClick() { window.open('https://www.cbnuholdings.com/meeting-booking', '_blank'); }
  </script>
</head>
<body>
  <div class="cta" onclick='handleClick()'>미팅·상담 예약 문의</div>
</body>
